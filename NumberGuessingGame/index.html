<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="header1">Daniel's Number Guessing Game</h1>
    <div class="outer">
        <div class="card">
            <h2 class="header2">Let's Play a Game</h2>
            <label class="box-label" for="input-box">Take a guess</label>
            <input id="input-box" placeholder="guess a number 1-100">
            <button id="button">Confirm guess</button>
            <h3 id="output"></h3>
            <button id="restart">Restart</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
