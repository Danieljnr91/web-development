            button {

                transition: width 0.15s, height 0.15s, background-colour 0.15s, color 0.15s, font-size 0.15s, font-weight 0.15s;
            }
            button:hover{
                transition-duration: 0.4s;
                background-color: red;
                width: 177px;
                height: 50px;
                font-size: 17px;
                font-weight: bold;
                box-shadow: 5px 5px 10px black;

            button:active {
                opacity: 0.4;
